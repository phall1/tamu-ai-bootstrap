# Git hooks. Installed by `bin/setup` (lefthook install).
# Each check only runs when matching files are staged.
pre-commit:
  parallel: true
  commands:
    secrets:
      run: gitleaks git --pre-commit --staged --redact --no-banner
    python:
      glob: "*.py"
      run: ruff check --fix {staged_files} && ruff format {staged_files}
      stage_fixed: true
    typescript:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc}"
      exclude:
        - ".claude/**"
        - "tools/oxlint/anti-slop/**"
      run: >-
        bun x oxfmt --no-error-on-unmatched-pattern {staged_files} &&
        bun x oxlint --fix --type-aware --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
